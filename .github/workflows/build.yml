name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:    # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 与 build.gradle.kts 里 compileSdk / targetSdk 对齐
          android-version: 34
          # 显式列包, 避免 v3 默认装已下架的 'tools' 包导致 "Failed to find package 'tools'"
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run lint (失败不阻塞构建)
        run: ./gradlew lintDebug --no-daemon || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon --stacktrace || echo "release build skipped"

      - name: Collect APK artifacts
        if: success()
        shell: bash
        run: |
          mkdir -p artifacts
          # 找所有 APK (debug 必有, release 可能未生成)
          find app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \; || true
          ls -la artifacts/

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GeQuHai-APK
          path: artifacts/*.apk
          if-no-files-found: warn
          retention-days: 30